<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title id="page-title">异世界图书馆</title>
  <link rel="icon" href="data:,">

  <!-- Supabase SDK importmap：无构建工具时通过 esm.sh 加载 -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>

  <link rel="stylesheet" href="css/style.css?v=20260605">
  <!-- 字体：楷体本地优先，无外部依赖 -->
  <script src="js/lib/tailwindcss.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: '#f5e6c8',
            'parchment-dark': '#e8d5a8',
            ink: '#2c2419',
            'ink-light': '#5c4d3c',
            'magic-blue': '#4a7c9b',
            'magic-gold': '#c9a227',
            wood: '#8b6914'
          },
          fontFamily: {
            serif: ['Noto Serif SC', 'serif'],
            display: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen text-ink">

  <!-- 加载进度条 -->
  <div id="loading-screen" class="fixed inset-0 z-[999] flex flex-col items-center justify-center" style="background: radial-gradient(ellipse at center, #3d2b1f 0%, #1a1410 100%);">
    <div class="text-center">
      <div class="text-6xl mb-6 animate-bounce">📚</div>
      <div class="w-64 h-2 bg-white/10 rounded-full overflow-hidden mb-4">
        <div id="loading-bar" class="h-full bg-gradient-to-r from-amber-600 to-amber-400 rounded-full transition-all duration-300" style="width:0%"></div>
      </div>
      <p id="loading-text" class="text-amber-200/60 text-sm font-serif">正在推开馆门...</p>
    </div>
  </div>

  <!-- 顶部导航栏 -->
  <nav class="parchment-bg border-b-4 border-wood sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 flex-shrink-0">
        <span class="text-3xl">📚</span>
        <div>
          <h1 class="font-display text-xl font-bold text-ink whitespace-nowrap" id="nav-library-name">归墟图书馆</h1>
          <p class="text-xs text-ink-light hidden sm:block" id="nav-library-subtitle">夹缝中的归墟 · 位面枢纽</p>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:gap-4 flex-wrap justify-end w-full sm:w-auto mt-1 sm:mt-0">
        <!-- 资源区：点击展开完整资源卡片（小屏默认只显示金币） -->
        <div class="relative">
          <button type="button" id="status-resource-btn" class="bg-wood/20 px-2 sm:px-3 py-1 rounded-full flex items-center gap-1 sm:gap-2 cursor-pointer hover:bg-wood/30 transition-colors" title="查看资源">
            <span class="text-magic-gold">💰</span>
            <span class="font-bold text-sm" id="status-coins">1,250</span>
            <span class="hidden sm:inline text-ink-light/60 text-xs">▼</span>
          </button>
          <div id="status-resource-card" class="hidden absolute right-0 top-full mt-2 z-50 parchment-bg border border-wood/30 rounded-xl shadow-xl p-3 min-w-[150px]">
            <div class="flex items-center justify-between gap-3 mb-2 pb-2 border-b border-wood/20">
              <span class="text-sm text-ink-light">💰 智慧之光</span>
              <span class="font-bold text-sm" id="status-coins-card">1,250</span>
            </div>
            <div class="flex items-center justify-between gap-3 mb-2 pb-2 border-b border-wood/20">
              <span class="text-sm text-ink-light">💡 灵感</span>
              <span class="font-bold text-sm text-purple-400" id="status-inspiration-card">0</span>
            </div>
            <div class="flex items-center justify-between gap-3">
              <span class="text-sm text-ink-light">✨ 氛围</span>
              <span class="font-bold text-sm text-magic-blue" id="status-atmosphere-card">0/500</span>
            </div>
          </div>
        </div>

        <span id="now-playing" class="text-xs text-ink-light/60 mx-1 hidden"></span>

        <!-- 音频控制：小屏也保留入口，避免买了环境音没地方调 -->
        <button type="button" id="music-selector-btn" class="text-lg cursor-pointer hover:scale-110 transition-transform" title="选择音乐">🎼</button>
        <button type="button" id="music-toggle" class="text-lg cursor-pointer hover:scale-110 transition-transform" title="开关音乐">🔈</button>
        <button type="button" id="nav-bag-btn" class="text-lg cursor-pointer hover:scale-110 transition-transform" title="行囊">🎒</button>

        <!-- 更多菜单：收纳语言切换 + 存档管理 -->
        <div class="relative">
          <button type="button" id="nav-more-btn" class="text-lg cursor-pointer hover:scale-110 transition-transform" title="更多">⚙️</button>
          <div id="nav-more-menu" class="hidden absolute right-0 top-full mt-2 z-50 parchment-bg border border-wood/30 rounded-xl shadow-xl p-2 min-w-[160px]">
            <div class="px-3 py-1.5 text-[10px] font-bold text-ink-light/60 uppercase tracking-wider">语言 / Language</div>
            <button type="button" data-locale="zh" class="nav-more-lang-btn w-full text-left px-3 py-2 rounded-lg hover:bg-wood/20 text-sm text-ink flex items-center gap-2">
              <span>🌐</span><span>中文</span>
            </button>
            <button type="button" data-locale="en" class="nav-more-lang-btn w-full text-left px-3 py-2 rounded-lg hover:bg-wood/20 text-sm text-ink flex items-center gap-2">
              <span>🌐</span><span>English</span>
            </button>
            <div class="my-1.5 border-t border-wood/20"></div>
            <button type="button" id="nav-more-save" class="w-full text-left px-3 py-2 rounded-lg hover:bg-wood/20 text-sm text-ink flex items-center gap-2">
              <span>💾</span><span>存档管理</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 标签导航 -->
  <div class="max-w-6xl mx-auto px-4 pt-4">
    <div class="flex flex-wrap gap-1 mb-6" id="nav-tabs">
      <button id="tab-focus" class="nav-btn active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather-icon"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg> <span class="tab-label">缮写室</span></button>
      <button id="tab-bookshelf" class="nav-btn"><span class="mr-1">📖</span><span class="tab-label">大书库</span></button>
      <button id="tab-library" class="nav-btn"><span class="mr-1">🏛️</span><span class="tab-label">馆长办公室</span></button>
      <button id="tab-visitors" class="nav-btn"><span class="mr-1">☕</span><span class="tab-label">读者沙龙</span></button>
      <button id="tab-archive" class="nav-btn"><span class="mr-1">📜</span><span class="tab-label">馆史档案</span></button>
      <button id="tab-shop" class="nav-btn"><span class="mr-1">🌌</span><span class="tab-label">位面商店</span></button>
    </div>

    <!-- 页面容器 -->
    <div id="page-focus" class="page-section"></div>
    <div id="page-bookshelf" class="page-section hidden"></div>
    <div id="page-library" class="page-section hidden"></div>
    <div id="page-visitors" class="page-section hidden"></div>
    <div id="page-archive" class="page-section hidden"></div>
    <div id="page-shop" class="page-section hidden"></div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/save-manager.js"></script>
  <!-- 调试控制台：仅本地开发加载，生产环境文件不在仓库中，静默跳过 -->
  <script type="module">
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      import('./js/dev-console.js').then(m => m.initDevConsole()).catch(() => {});
    }
  </script>
</body>
</html>
